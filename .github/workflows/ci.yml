# Checks every push and pull request: types, tests (unit and database, on an
# in-memory PostgreSQL), translations, formatting, lint, a production build
# and the dependency audit (npm run verify), on Linux and on Windows: ETNA is
# hosted on both. Nothing is deployed from here.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Actions pinned to a commit (the tag in the comment), not a movable tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node.js 24 LTS, as on servers.
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify
        run: npm run verify

  # A real Linux server install (deploy/linux/install.sh with systemd) against
  # an existing PostgreSQL, then the whole life of a server with psctl: first
  # install, encrypted backups, an update, a reinstall that must keep the keys,
  # a restore into a new database, an upgrade from a release file, a rollback,
  # and moving the database to another PostgreSQL server. Each step is checked
  # by signing in and reading data (deploy/smoke-test.sh).
  linux-systemd:
    name: Linux install (systemd)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 30
      # The "database VM" that psctl db move copies to.
      postgres-b:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      MIGRATION_DATABASE_URL: postgres://etna_owner@127.0.0.1:5432/etna
      ADMIN_DATABASE_URL: postgres://etna_owner@127.0.0.1:5432/etna
      PGPASSWORD: ci-owner-password
      SMOKE: sh deploy/smoke-test.sh http://127.0.0.1:4028 ci@example.com ci-password-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Node.js on the system PATH (as a distribution package would install it)
        run: sudo ln -sf "$(command -v node)" /usr/local/bin/node
      - name: PostgreSQL 18 client tools (pg_dump, pg_restore)
        run: |
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-18 >/dev/null
      - name: Database owners and databases
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          # CREATEDB: psctl restore makes a new database beside the old one.
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE etna_owner LOGIN CREATEROLE CREATEDB PASSWORD 'ci-owner-password'" \
            -c "CREATE DATABASE etna OWNER etna_owner"
          psql -h 127.0.0.1 -p 5433 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE etna_owner LOGIN CREATEROLE PASSWORD 'ci-owner-b-password'" \
            -c "CREATE DATABASE etna OWNER etna_owner"
      - name: Install
        run: sudo env "PATH=$PATH" MIGRATION_DATABASE_URL="$MIGRATION_DATABASE_URL" PGPASSWORD="$PGPASSWORD" deploy/linux/install.sh --yes
      - name: Units and permissions
        run: |
          systemctl is-active etna etna-worker
          sudo systemd-analyze verify /etc/systemd/system/etna.service /etc/systemd/system/etna-worker.service /etc/systemd/system/etna-backup.service /etc/systemd/system/etna-backup.timer /etc/systemd/system/etna-db-backup.service /etc/systemd/system/etna-db-backup.timer
          test "$(sudo stat -c '%U:%G %a' /etc/etna/etna.env)" = "root:etna 640"
          test "$(sudo stat -c '%U:%G %a' /etc/etna/psctl.env)" = "root:root 600"
          test "$(sudo stat -c '%U:%G %a' /etc/etna/owner.pgpass)" = "root:root 600"
          test "$(sudo stat -c '%U:%G' /var/lib/etna)" = "etna:etna"
          if sudo -u etna touch /opt/etna/current/write-test 2>/dev/null; then echo "the service can write the app folder"; exit 1; fi
          if sudo -u etna cat /etc/etna/owner.pgpass 2>/dev/null; then echo "the service can read the owner's password"; exit 1; fi
          # The owner's password is in the password file, not in psctl.env.
          if sudo grep -q ci-owner-password /etc/etna/psctl.env; then exit 1; fi
      - name: First account and smoke test
        run: |
          printf 'ci-password-0123456789' | sudo psctl users create-user --email ci@example.com --password-stdin
          $SMOKE
          sudo psctl status
          sudo psctl doctor
      - name: Encrypted backups (psctl backup-setup, the systemd unit, verify)
        run: |
          # A document, so the backup carries files.
          sudo install -d -o etna -g etna /var/lib/etna/documents/ci
          echo "invoice 42" | sudo -u etna tee /var/lib/etna/documents/ci/invoice.txt >/dev/null
          sudo install -d -m 0700 /srv/nas-etna
          printf 'ci-backup-passphrase' | sudo psctl backup-setup --copy-to /srv/nas-etna
          systemctl is-enabled etna-backup.timer
          sudo systemctl start etna-backup.service
          backup=$(sudo ls /var/backups/etna | grep -E '^etna-offsite-.*\.etnabak$' | tail -n 1)
          test -n "$backup"
          sudo cmp "/var/backups/etna/$backup" "/srv/nas-etna/$backup"
          printf 'ci-backup-passphrase' | sudo psctl verify "$backup"
          if printf 'wrong-passphrase' | sudo psctl verify "$backup"; then exit 1; fi
          echo "BACKUP=$backup" >>"$GITHUB_ENV"
          sudo psctl doctor
      - name: Update over the running install (settings kept, a backup first)
        run: |
          before=$(readlink -f /opt/etna/current)
          count=$(sudo ls /var/backups/etna | grep -c '\.etnabak$')
          # No database settings given: psctl.env and the owner's password file are used.
          sudo env -u PGPASSWORD -u MIGRATION_DATABASE_URL "PATH=$PATH" deploy/linux/install.sh --yes
          test "$(readlink -f /opt/etna/current)" != "$before"
          test -d "$before"
          test "$(sudo ls /var/backups/etna | grep -c '\.etnabak$')" -gt "$count"
          $SMOKE
      - name: A reinstall without the old settings is refused; with them it keeps everyone's keys
        run: |
          before=$(readlink -f /opt/etna/current)
          sudo mv /etc/etna/etna.env /root/etna.env.saved
          if sudo env -u PGPASSWORD "PATH=$PATH" deploy/linux/install.sh --yes 2>err.txt; then exit 1; fi
          grep -q 'already holds ETNA' err.txt
          test "$(readlink -f /opt/etna/current)" = "$before"
          sudo env -u PGPASSWORD "PATH=$PATH" deploy/linux/install.sh --yes --settings-from /root/etna.env.saved
          test "$(sudo grep '^MFA_ENCRYPTION_KEY=' /root/etna.env.saved)" = "$(sudo grep '^MFA_ENCRYPTION_KEY=' /etc/etna/etna.env)"
          $SMOKE
      - name: Restore into a new database, then the switch
        run: |
          # Changes after the backup: a new account and a deleted document.
          printf 'late-password-0123456789' | sudo psctl users create-user --email late@example.com --password-stdin
          sudo rm /var/lib/etna/documents/ci/invoice.txt
          printf 'ci-backup-passphrase' | sudo psctl restore "$BACKUP" --yes
          new=$(sudo sed -n 's/^MIGRATION_DATABASE_URL=.*\///p' /etc/etna/psctl.env)
          echo "restored into $new"
          case "$new" in etna_restore_*) ;; *) exit 1 ;; esac
          users() { psql -h 127.0.0.1 -U etna_owner -d "$1" -tAc "select count(*) from auth.users where email = 'late@example.com'"; }
          test "$(users "$new")" = 0
          # The old database is untouched.
          test "$(users etna)" = 1
          test "$(sudo cat /var/lib/etna/documents/ci/invoice.txt)" = "invoice 42"
          sudo ls -d /var/lib/etna/before-restore-*
          if sudo ls -d /var/lib/etna/.restore-* 2>/dev/null; then echo "the unpacked backup was left behind"; exit 1; fi
          $SMOKE
          sudo psctl databases
          sudo psctl doctor
      - name: Upgrade from a release file, then a rollback
        run: |
          mkdir -p /tmp/pkg/etna-next
          git archive HEAD | tar -x -C /tmp/pkg/etna-next
          tar -czf /tmp/etna-next.tar.gz -C /tmp/pkg etna-next
          before=$(readlink -f /opt/etna/current)
          sudo psctl upgrade /tmp/etna-next.tar.gz --yes
          after=$(readlink -f /opt/etna/current)
          test "$after" != "$before"
          $SMOKE
          sudo psctl rollback --yes
          test "$(readlink -f /opt/etna/current)" = "$before"
          $SMOKE
      - name: Move the database to another PostgreSQL server
        run: |
          printf 'ci-owner-b-password' | sudo psctl db move postgres://etna_owner@127.0.0.1:5433/etna --yes
          grep -q '127.0.0.1:5433/etna' <(sudo cat /etc/etna/psctl.env)
          sudo grep -q '^DATABASE_URL=postgres://etna_app:.*@127.0.0.1:5433/etna$' /etc/etna/etna.env
          test "$(PGPASSWORD=ci-owner-b-password psql -h 127.0.0.1 -p 5433 -U etna_owner -d etna -tAc "select count(*) from auth.users where email = 'ci@example.com'")" = 1
          $SMOKE
          sudo psctl status
      - name: Logs
        if: failure()
        run: sudo journalctl -u etna -u etna-worker -u etna-backup --no-pager -n 200

  # A fresh Ubuntu server with nothing on it: install.sh --local-postgres
  # installs PostgreSQL 18 and creates the owner and database; running it
  # again changes nothing; a restore makes its new database locally.
  linux-local-postgres:
    name: Linux install (local PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SMOKE: sh deploy/smoke-test.sh http://127.0.0.1:4028 ci@example.com ci-password-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Node.js on the system PATH, and no PostgreSQL (as on a new server)
        run: |
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo apt-get purge -y -qq 'postgresql*' >/dev/null
          sudo rm -rf /var/lib/postgresql /etc/postgresql
      - name: Install with --local-postgres
        run: |
          sudo env "PATH=$PATH" deploy/linux/install.sh --local-postgres --yes
          pg_lsclusters -h | grep -E '^18 .* online'
          sudo grep -q '^ETNA_LOCAL_POSTGRES=1$' /etc/etna/psctl.env
          printf 'ci-password-0123456789' | sudo psctl users create-user --email ci@example.com --password-stdin
          $SMOKE
      - name: Running it again changes nothing
        run: |
          key=$(sudo grep '^MFA_ENCRYPTION_KEY=' /etc/etna/etna.env)
          sudo env "PATH=$PATH" deploy/linux/install.sh --local-postgres --yes
          test "$(sudo grep '^MFA_ENCRYPTION_KEY=' /etc/etna/etna.env)" = "$key"
          test "$(sudo -u postgres psql -tAc "select count(*) from pg_database where datname like 'etna%'")" = 1
          $SMOKE
      - name: Backup and restore on this server
        run: |
          printf 'ci-backup-passphrase' | sudo psctl backup-setup
          sudo psctl backup
          backup=$(sudo ls /var/backups/etna | grep -E '\.etnabak$' | tail -n 1)
          printf 'ci-backup-passphrase' | sudo psctl restore "$backup" --yes
          sudo -u postgres psql -tAc "select datname from pg_database where datname like 'etna_restore_%'" | grep -q etna_restore_
          $SMOKE
          sudo psctl doctor
      - name: Logs
        if: failure()
        run: sudo journalctl -u etna -u etna-worker -u postgresql --no-pager -n 200

  # The container setup (deploy/docker/compose.yml): build, first start,
  # account, sign-in, then a second start (migrations path).
  linux-docker:
    name: Linux install (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy/docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Settings
        run: printf 'POSTGRES_PASSWORD=ci-postgres-password\nETNA_OWNER_PASSWORD=ci-owner-password\n' > .env
      - name: Build and start
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4028/api/health && exit 0
            sleep 2
          done
          exit 1
      - name: First account
        run: printf 'ci-password-0123456789' | docker compose run --rm -T -e ADMIN_DATABASE_URL=postgres://etna_owner@db:5432/etna setup node scripts/admin/users.mjs create-user --email ci@example.com --password-stdin
      - name: Smoke test
        run: sh ../smoke-test.sh http://127.0.0.1:4028 ci@example.com ci-password-0123456789
      - name: Second start (keeps the keys, applies migrations)
        run: |
          before=$(docker compose run --rm -T --entrypoint sh setup -c 'grep MFA_ENCRYPTION_KEY /config/etna.env')
          docker compose up -d
          docker compose logs setup | grep -q 'Settings in /config/etna.env are ready'
          after=$(docker compose run --rm -T --entrypoint sh setup -c 'grep MFA_ENCRYPTION_KEY /config/etna.env')
          test "$before" = "$after"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4028/api/health && break; sleep 2; done
          sh ../smoke-test.sh http://127.0.0.1:4028 ci@example.com ci-password-0123456789
      - name: Worker is running
        run: test "$(docker compose ps worker --format '{{.State}}')" = running
      - name: Off-site backup (offsite profile) and its check
        run: |
          mkdir -p offsite offsite-keys
          printf 'ci-offsite-passphrase' | node ../../scripts/db/offsite.mjs keys --dir offsite-keys
          # The container user (uid 1000) reads the keys and writes the backups.
          sudo chown -R 1000:1000 offsite offsite-keys
          docker compose --profile offsite run --rm offsite
          file=$(sudo ls offsite | grep -E '^etna-offsite-.*\.etnabak$')
          test -n "$file"
          printf 'ci-offsite-passphrase' | docker compose --profile offsite run --rm -T offsite node scripts/db/offsite.mjs verify "/offsite/$file"
          # The in-app backup tools find pg_dump 18 in the image too.
          docker compose run --rm -T --entrypoint pg_dump app --version | grep -q ' 18\.'
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
